  <style>
    .t, .spin, .gather, .wave, .shine { animation-duration: 3400ms; animation-iteration-count: infinite; animation-fill-mode: both; }
    .t { transform-box: fill-box; transform-origin: center; animation-name: burst; }
    .spin { transform-origin: 150px 150px; animation-name: spin; }
    .gather { transform-origin: 150px 150px; animation-name: gather; }
    .wave { transform-box: fill-box; transform-origin: center; animation-name: wave; opacity: 0; }
    .shine { animation-name: shine; }
    @keyframes burst {
      0%, 9% { transform: none; animation-timing-function: cubic-bezier(.12, .82, .28, 1); }
      33% { transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(var(--s)); animation-timing-function: linear; }
      41% { transform: translate(calc(var(--x) * 1.07), calc(var(--y) * 1.07)) rotate(calc(var(--r) * 1.12)) scale(var(--s)); animation-timing-function: cubic-bezier(.62, 0, .22, 1.18); }
      62%, 100% { transform: none; }
    }
    @keyframes gather {
      0%, 5% { transform: none; animation-timing-function: cubic-bezier(.4, 0, .6, 1); }
      9.5% { transform: scale(.9); animation-timing-function: cubic-bezier(.2, .8, .3, 1); }
      14%, 100% { transform: none; }
    }
    @keyframes spin {
      0%, 63% { transform: none; animation-timing-function: cubic-bezier(.68, 0, .24, 1); }
      88%, 100% { transform: rotate(360deg); }
    }
    @keyframes wave {
      0%, 9% { opacity: 0; transform: scale(.25); animation-timing-function: cubic-bezier(.1, .7, .3, 1); }
      12% { opacity: .7; }
      38%, 100% { opacity: 0; transform: scale(2.1); }
    }
    @keyframes shine {
      0%, 87% { transform: translateX(0); animation-timing-function: cubic-bezier(.45, 0, .25, 1); }
      100% { transform: translateX(520px); }
    }
    @keyframes breathe { 50% { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) {
      .t, .spin, .gather, .wave, .shine { animation: none; }
      .wave, .shine { display: none; }
      .gather { animation: breathe 2.4s ease-in-out infinite; }
    }
  </style>
